# Checks every pull request to main (#78). No secrets: the backend tests use the
# in-memory store and a fake photo reviewer, and the frontend job skips `next build`,
# which would need the Clerk publishable key.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test --if-present # frontend tests arrive with #81

  mastra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mastra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # the tests run TypeScript directly, which needs Node >= 22.18
          cache: npm
          cache-dependency-path: mastra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
